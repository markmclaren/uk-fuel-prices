name: UK Fuel Price Aggregator

on:
  schedule:
    # Run once a day at 06:00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      full_refresh:
        description: 'Force full baseline cache refresh'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  collect-fuel-prices:
    name: Collect & Export UK Fuel Prices
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore Cache State
        uses: actions/cache@v4
        with:
          path: config/.storage/uk_fuel_finder
          key: uff-storage-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            uff-storage-${{ runner.os }}-

      - name: Fetch Fuel Finder Data & Write to docs/
        env:
          UFF_CLIENT_ID: ${{ secrets.UFF_CLIENT_ID }}
          UFF_CLIENT_SECRET: ${{ secrets.UFF_CLIENT_SECRET }}
          UFF_BASE_URL: ${{ secrets.UFF_BASE_URL }}
          UFF_CONFIG_DIR: config/.storage/uk_fuel_finder
          UFF_OUTPUT_DIR: docs
        run: |
          REFRESH_FLAG=""
          if [ "${{ github.event.inputs.full_refresh }}" = "true" ]; then
            REFRESH_FLAG="--full-refresh"
          fi

          python3 uff.py --debug --dump --compact --max-price-age-days 7 $REFRESH_FLAG

      - name: Commit Updated Prices & State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/ config/.storage/uk_fuel_finder/
          if git diff --staged --quiet; then
            echo "No price updates to commit."
          else
            git commit -m "chore(data): auto-update UK fuel prices in docs/ [skip ci]"
            git push
          fi
