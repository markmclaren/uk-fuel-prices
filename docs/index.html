<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UK True Cost Fuel Finder</title>
  <meta name="description" content="Find the cheapest petrol station near you, accounting for the fuel you'll burn driving there and back.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <style>
    :root {
      --bg:          #0d1117;
      --surface:     #161b22;
      --surface2:    #1c2331;
      --surface3:    #21293a;
      --border:      rgba(255,255,255,0.08);
      --border-bright: rgba(255,255,255,0.16);
      --text:        #e6edf3;
      --text-muted:  #7d8590;
      --accent:      #58a6ff;
      --accent-glow: rgba(88,166,255,0.15);
      --green:       #3fb950;
      --green-glow:  rgba(63,185,80,0.15);
      --amber:       #d29922;
      --amber-glow:  rgba(210,153,34,0.12);
      --red:         #f85149;
      --red-glow:    rgba(248,81,73,0.12);
      --radius:      12px;
      --radius-sm:   8px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 15px; -webkit-font-smoothing: antialiased; overflow-x: hidden; -webkit-text-size-adjust: 100%; }
    #app { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); grid-template-rows: 100vh; height: 100vh; min-height: 100dvh; width: 100%; overflow: hidden; }
    #sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    /* ── Mobile panel toggle (bottom-left, away from map controls) ── */
    .mobile-sidebar-toggle {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      min-height: 48px;
      padding: 10px 22px;
      border: 1px solid var(--border-bright);
      border-radius: 999px;
      background: rgba(22, 27, 34, 0.95);
      color: var(--text);
      font: inherit;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(88,166,255,0.1);
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      white-space: nowrap;
    }
    .mobile-sidebar-toggle:hover,
    .mobile-sidebar-toggle:focus-visible {
      border-color: var(--accent);
      background: rgba(28, 35, 49, 0.98);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 3px var(--accent-glow);
    }
    .mobile-sidebar-toggle:active { opacity: 0.85; }
    /* drag-handle hint at top of sidebar on mobile */
    .sidebar-drag-handle {
      display: none;
      width: 40px;
      height: 4px;
      background: var(--border-bright);
      border-radius: 2px;
      margin: 10px auto 4px;
      flex-shrink: 0;
    }
    #sidebar-header { padding: 12px 20px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    .logo-row { display: flex; align-items: center; gap: 10px; }
    .logo-icon { width: 28px; height: 28px; background: linear-gradient(135deg, #58a6ff, #3fb950); border-radius: 7px; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
    h1 { font-size: 1rem; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--green)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    /* compact data-status bar */
    #data-status { display: none; align-items: center; gap: 6px; padding: 5px 10px; border-radius: 6px; background: var(--surface2); border: 1px solid var(--border); font-size: 0.72rem; color: var(--text-muted); overflow: hidden; cursor: pointer; position: relative; transition: border-color 0.15s; }
    #data-status:hover { border-color: var(--accent); }
    #data-status input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
    #data-status.loaded { color: var(--green); border-color: rgba(63,185,80,0.35); background: rgba(63,185,80,0.06); }
    #data-status-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    #controls { padding: 10px 20px 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; }
    .control-row { display: flex; flex-wrap: wrap; gap: 10px; }
    .control-row.row, .loc-row.row { margin-right: 0; margin-left: 0; }
    .control-row.row > [class^="col"], .control-row.row > [class*=" col"], .loc-row.row > [class^="col"], .loc-row.row > [class*=" col"] {
      padding-right: 0;
      padding-left: 0;
    }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field.full { width: 100%; }
    label { font-size: 0.72rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
    .input-wrap { position: relative; display: flex; align-items: center; }
    input[type="number"], input[type="text"], select { width: 100%; min-height: 44px; background: var(--surface2); border: 1px solid var(--border-bright); border-radius: var(--radius-sm); color: var(--text); font-family: inherit; font-size: 0.875rem; padding: 9px 10px; outline: none; transition: border-color 0.15s, box-shadow 0.15s; -moz-appearance: textfield; }
    input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    select { cursor: pointer; }
    .unit { position: absolute; right: 10px; font-size: 0.72rem; color: var(--text-muted); pointer-events: none; }
    input.has-unit { padding-right: 44px; }
    /* upload-zone kept for drag-and-drop on desktop but hidden by default */
    .upload-zone { display: none; }
    .loc-row { display: flex; gap: 8px; align-items: flex-end; }
    .loc-row .field { flex: 1; }
    #btn-locate { flex-shrink: 0; min-height: 42px; padding: 0 12px; background: var(--surface2); border: 1px solid var(--border-bright); border-radius: var(--radius-sm); color: var(--text); font-family: inherit; font-size: 0.85rem; cursor: pointer; display: flex; align-items: center; gap: 6px; transition: border-color 0.15s, background 0.15s; white-space: nowrap; }
    #btn-locate:hover { border-color: var(--accent); background: var(--accent-glow); }
    #btn-search { width: 100%; min-height: 44px; padding: 10px; background: linear-gradient(135deg, #1f6feb, #238636); border: none; border-radius: var(--radius-sm); color: #fff; font-family: inherit; font-size: 0.9rem; font-weight: 600; cursor: pointer; letter-spacing: 0.02em; transition: opacity 0.15s, transform 0.1s; }
    #btn-search:hover { opacity: 0.9; }
    #btn-search:active { transform: scale(0.98); }
    #btn-search:disabled { opacity: 0.4; cursor: not-allowed; }
    .sort-bar { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 20px; flex-shrink: 0; border-bottom: 1px solid var(--border); }
    .sort-btn { flex: 1 1 100px; min-height: 40px; padding: 6px 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; color: var(--text-muted); font-family: inherit; font-size: 0.75rem; font-weight: 500; cursor: pointer; text-align: center; transition: all 0.15s; }
    .sort-btn.active { background: var(--accent-glow); border-color: var(--accent); color: var(--accent); }
    #results-header { padding: 12px 20px 8px; flex-shrink: 0; }
    #result-count { font-size: 0.78rem; color: var(--text-muted); }
    .unit-btn { min-height: 34px; padding: 3px 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; color: var(--text-muted); font-family: inherit; font-size: 0.72rem; font-weight: 500; cursor: pointer; transition: all 0.15s; }
    .unit-btn.active { background: var(--accent-glow); border-color: var(--accent); color: var(--accent); }

    .preset-btn { min-height: 32px; padding: 2px 7px; background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; color: var(--text-muted); font-family: inherit; font-size: 0.68rem; font-weight: 600; cursor: pointer; transition: all 0.15s; }
    .preset-btn:hover { border-color: var(--accent); color: var(--text); }
    .preset-btn.active { background: var(--accent-glow); border-color: var(--accent); color: var(--accent); }
    input[type="range"] { accent-color: var(--accent); height: 5px; border-radius: 3px; background: var(--surface2); outline: none; }

    #results { flex: 1; overflow-y: auto; padding: 0 12px 16px; }
    #results::-webkit-scrollbar { width: 4px; }
    #results::-webkit-scrollbar-track { background: transparent; }
    #results::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 2px; }

    /* ── Table layout ── */
    .table-wrap { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; border-radius: var(--radius-sm); border: 1px solid var(--border); background: var(--surface2); }
    .data-table { width: 100%; min-width: 540px; border-collapse: collapse; font-size: 0.82rem; text-align: left; }
    .data-table th { background: var(--surface3); color: var(--text-muted); padding: 9px 10px; font-weight: 600; text-align: left; cursor: pointer; border-bottom: 1px solid var(--border-bright); user-select: none; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; transition: color 0.15s, background 0.15s; }
    .data-table th:hover { color: var(--text); background: var(--surface2); }
    .data-table th.active-th { color: var(--accent); background: rgba(88,166,255,0.08); }
    .data-table th.num-col, .data-table td.num-col { text-align: right; }
    .data-table td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .data-table tr { cursor: pointer; transition: background 0.15s; }
    .data-table tr:hover { background: var(--surface3); }
    .data-table tr.selected { background: var(--surface3); outline: 1px solid var(--accent); }

    .data-table tr.status-worth-it td:first-child { border-left: 4px solid var(--green); }
    .data-table tr.status-breakeven td:first-child { border-left: 4px solid var(--amber); }
    .data-table tr.status-not-worth td:first-child { border-left: 4px solid var(--red); }
    .data-table tr.status-nearest td:first-child { border-left: 4px solid var(--accent); }

    .data-table tr.status-worth-it { background: rgba(63, 185, 80, 0.04); }
    .data-table tr.status-breakeven { background: rgba(210, 153, 34, 0.04); }
    .data-table tr.status-not-worth { background: rgba(248, 81, 73, 0.04); }
    .data-table tr.status-nearest { background: rgba(88, 166, 255, 0.04); }

    /* ── Mobile result cards (replace table on small screens) ── */
    .card-list { display: flex; flex-direction: column; gap: 8px; }
    .station-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      position: relative;
      overflow: hidden;
    }
    .station-card::before {
      content: '';
      position: absolute;
      left: 0; top: 0; bottom: 0;
      width: 4px;
    }
    .station-card.status-worth-it::before  { background: var(--green); }
    .station-card.status-breakeven::before { background: var(--amber); }
    .station-card.status-not-worth::before { background: var(--red); }
    .station-card.status-nearest::before   { background: var(--accent); }
    .station-card.status-worth-it  { background: rgba(63,185,80,0.05); }
    .station-card.status-breakeven { background: rgba(210,153,34,0.05); }
    .station-card.status-not-worth { background: rgba(248,81,73,0.05); }
    .station-card.status-nearest   { background: rgba(88,166,255,0.05); }
    .station-card.selected { border-color: var(--accent); background: rgba(88,166,255,0.08); }
    .station-card:active { opacity: 0.85; }
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
    .card-name { font-weight: 600; font-size: 0.88rem; line-height: 1.3; flex: 1; }
    .card-brand { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }
    .card-dist { font-size: 0.78rem; color: #a5d6ff; white-space: nowrap; }
    .card-prices { display: flex; gap: 12px; }
    .card-price-block { display: flex; flex-direction: column; gap: 1px; }
    .card-price-label { font-size: 0.63rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
    .card-price-main { font-size: 1rem; font-weight: 700; line-height: 1; }
    .card-price-sub { font-size: 0.68rem; color: var(--text-muted); margin-top: 2px; }

    .state-msg { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 0.85rem; line-height: 1.7; }
    .state-msg .icon { font-size: 2.5rem; margin-bottom: 12px; }
    .state-msg strong { display: block; color: var(--text); margin-bottom: 6px; font-size: 0.95rem; }
    #map { width: 100%; height: 100%; }
    .maplibregl-popup-content { background: var(--surface2) !important; border: 1px solid var(--border-bright) !important; border-radius: var(--radius-sm) !important; color: var(--text) !important; box-shadow: 0 8px 32px rgba(0,0,0,0.5) !important; padding: 12px 14px !important; font-family: 'Inter', sans-serif !important; min-width: 200px; }
    .maplibregl-popup-tip { display: none !important; }
    .maplibregl-popup-close-button { color: var(--text-muted) !important; font-size: 16px !important; right: 8px !important; top: 6px !important; }
    .popup-name { font-weight: 600; font-size: 0.85rem; margin-bottom: 3px; }
    .popup-brand { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; }
    .popup-prices { display: flex; gap: 12px; }
    .popup-price { display: flex; flex-direction: column; gap: 1px; }
    .popup-price-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
    .popup-price-val { font-size: 1rem; font-weight: 700; }

    /* ── Responsive: tablet & mobile (< 992px) ── */
    @media (max-width: 991.98px) {
      #app {
        grid-template-columns: 1fr;
        /* Map sits above, panel below — map gets priority height */
        grid-template-rows: minmax(40vh, 1fr) auto;
        height: 100dvh;
        overflow: hidden;
      }
      /* Map always visible at top */
      #map { min-height: 35vh; height: 100%; order: -1; }
      #sidebar { border-right: 0; border-top: 1px solid var(--border); overflow-y: auto; max-height: 62vh; -webkit-overflow-scrolling: touch; }
      /* Sidebar hidden = full-screen map */
      #app.sidebar-hidden { grid-template-rows: 1fr 0; }
      #app.sidebar-hidden #sidebar { max-height: 0; overflow: hidden; border-top: 0; }
      .loc-row { flex-wrap: wrap; }
      .loc-row .field { width: 100%; }
      #btn-locate { width: 100%; justify-content: center; }
      #results { max-height: none; }
      .sidebar-drag-handle { display: block; }
      /* Hide table, show cards on mobile */
      .table-wrap { display: none; }
      .card-list { display: flex; }
    }
    /* Desktop: hide toggle & cards */
    @media (min-width: 992px) {
      .mobile-sidebar-toggle { display: none; }
      .sidebar-drag-handle { display: none; }
      .card-list { display: none !important; }
      .table-wrap { display: block; }
    }
    /* ── Phone (< 576px) ── */
    @media (max-width: 575.98px) {
      #sidebar-header, #controls, .sort-bar, #results-header { padding-left: 12px; padding-right: 12px; }
      #controls { gap: 10px; }
      .radius-presets { display: flex; flex-wrap: wrap; }
      #results { padding: 0 6px 80px; } /* bottom pad for toggle button */
      /* Prevent iOS auto-zoom on focus */
      input[type="number"], input[type="text"], select { font-size: 16px; }
      #btn-search { min-height: 50px; font-size: 1rem; }
      #btn-locate { min-height: 48px; }
    }
  </style>
</head>
<body>
<div id="app" class="container-fluid p-0">
  <button
    type="button"
    id="mobile-sidebar-toggle"
    class="mobile-sidebar-toggle"
    aria-controls="sidebar"
    aria-expanded="false"
    aria-label="Show filters and station list"
  >⛽ Show panel</button>
  <div id="sidebar">
    <div class="sidebar-drag-handle" aria-hidden="true"></div>
    <div id="sidebar-header">
      <div class="logo-row">
        <div class="logo-icon">⛽</div>
        <h1>True Cost Fuel Finder</h1>
      </div>
    </div>
    <div id="controls">
      <!-- Compact data status bar (shown once data loads; clickable to change file) -->
      <div id="data-status" role="button" aria-label="Change price data file" title="Click to load a different file">
        <input type="file" id="file-input" accept=".json" aria-label="Load prices JSON file">
        <span id="data-status-text">⏳ Loading price data…</span>
      </div>
      <div class="field full">
        <label>Your Location (or click on map)</label>
        <div class="loc-row row g-2">
          <div class="field col-12 col-sm">
            <div class="input-wrap">
              <input type="number" id="lat" placeholder="Latitude" step="any" aria-label="Latitude">
            </div>
          </div>
          <div class="field col-12 col-sm">
            <div class="input-wrap">
              <input type="number" id="lon" placeholder="Longitude" step="any" aria-label="Longitude">
            </div>
          </div>
          <div class="col-12 col-sm-auto d-flex">
            <button id="btn-locate" class="w-100" title="Use my current location" aria-label="Detect my location">📍 Locate me</button>
          </div>
        </div>
      </div>
      <div class="control-row row g-2">
        <div class="field col-12 col-sm-6">
          <label>Fuel Type</label>
          <select id="fuel-type" aria-label="Fuel type">
            <option value="E10">E10 (Petrol)</option>
            <option value="E5">E5 (Premium Petrol)</option>
            <option value="B7_STANDARD">B7 (Diesel)</option>
            <option value="B7_PREMIUM">B7 Premium</option>
            <option value="HVO">HVO</option>
          </select>
        </div>
        <div class="field col-12 col-sm-6">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <label>Search Radius</label>
            <span id="radius-val" style="color:var(--accent);font-weight:700;font-size:0.75rem;">15 km</span>
          </div>
          <div class="input-wrap">
            <input type="number" id="radius" value="15" min="1" max="100" class="has-unit" aria-label="Search radius in km">
            <span class="unit">km</span>
          </div>
        </div>
      </div>
      <div class="field full" style="margin-top:-4px;">
        <div class="d-flex flex-column flex-sm-row align-items-stretch align-items-sm-center gap-2">
          <input type="range" id="radius-slider" value="15" min="1" max="100" step="1" aria-label="Radius slider" style="flex:1;cursor:pointer;">
          <div class="radius-presets d-flex flex-wrap gap-1">
            <button class="preset-btn" data-r="5">5k</button>
            <button class="preset-btn" data-r="10">10k</button>
            <button class="preset-btn active" data-r="15">15k</button>
            <button class="preset-btn" data-r="25">25k</button>
            <button class="preset-btn" data-r="50">50k</button>
          </div>
        </div>
      </div>
      <div class="control-row row g-2">
        <div class="field col-12 col-sm-6">
          <label>Your MPG</label>
          <div class="input-wrap">
            <input type="number" id="mpg" value="40" min="1" max="200" step="0.5" class="has-unit" aria-label="Vehicle fuel economy in MPG">
            <span class="unit">mpg</span>
          </div>
        </div>
        <div class="field col-12 col-sm-6">
          <label>Tank Fill</label>
          <div class="input-wrap">
            <input type="number" id="tank" value="40" min="1" max="200" step="1" class="has-unit" aria-label="Litres to fill">
            <span class="unit">L</span>
          </div>
        </div>
      </div>
      <div class="field full" style="margin-top:2px;display:flex;flex-direction:column;gap:6px;">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;text-transform:none;font-size:0.8rem;color:var(--text);font-weight:500;">
          <input type="checkbox" id="exclude-costco" checked style="cursor:pointer;">
          Exclude Costco (membership required)
        </label>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;text-transform:none;font-size:0.8rem;color:var(--text);font-weight:500;">
          <input type="checkbox" id="exclude-motorway" checked style="cursor:pointer;">
          Exclude Motorway Services 🛣️
        </label>
      </div>
      <button id="btn-search" disabled>Find Cheapest Stations</button>
    </div>
    <div class="sort-bar" id="sort-bar" style="display:none;">
      <button class="sort-btn active" id="sort-effective" aria-pressed="true">&#8597; True Cost</button>
      <button class="sort-btn" id="sort-pump" aria-pressed="false">&#8597; Pump Price</button>
      <button class="sort-btn" id="sort-distance" aria-pressed="false">&#8597; Distance</button>
    </div>
    <div id="results-header" style="display:none;">
      <div class="d-flex flex-wrap justify-content-between align-items-center gap-2">
        <div id="result-count"></div>
        <div class="d-flex flex-wrap gap-1">
          <button class="unit-btn active" id="unit-tank" title="Show total price for a full tank in pounds">Full Tank (£)</button>
          <button class="unit-btn" id="unit-pence" title="Show price in pence per litre">p/L</button>
        </div>
      </div>
    </div>
    <div id="results">
      <div class="state-msg">
        <div class="icon">⛽</div>
        <strong>Load your price data to start</strong>
        Auto-loading <code>prices_latest.json</code> or upload a JSON file to start searching.
      </div>
    </div>
  </div>
  <div id="map"></div>
</div>
<script>
'use strict';

let priceData = null;
let myLat = null;
let myLon = null;
let results = [];
let currentAugmented = [];
let sortMode = 'effective';
let sortOrder = 'asc';
let displayMode = 'tank'; // 'tank' or 'pence'
let selectedId = null;
let map = null;
let popup = null;
let isSidebarHiddenOnMobile = true; // map-first on mobile by default
const mobileSidebarQuery = window.matchMedia('(max-width: 991.98px)');

function syncMobileSidebarState() {
  const app = document.getElementById('app');
  const toggle = document.getElementById('mobile-sidebar-toggle');
  const hidden = mobileSidebarQuery.matches && isSidebarHiddenOnMobile;
  app.classList.toggle('sidebar-hidden', hidden);
  toggle.setAttribute('aria-expanded', String(!hidden));
  toggle.setAttribute('aria-label', hidden ? 'Show filters and station list' : 'Hide filters and station list');
  toggle.innerHTML = hidden ? '⛽ Show panel' : '✕ Hide panel';
  requestAnimationFrame(() => map?.resize());
}

function toggleMobileSidebar() {
  if (!mobileSidebarQuery.matches) return;
  isSidebarHiddenOnMobile = !isSidebarHiddenOnMobile;
  syncMobileSidebarState();
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function createGeoJSONCircle(centerLon, centerLat, radiusKm, points = 128) {
  const coords = [];
  const kmInEqDegrees = 111.32;
  for (let i = 0; i <= points; i++) {
    const angle = (i * 360) / points;
    const rad = (angle * Math.PI) / 180;
    const dLat = (radiusKm / kmInEqDegrees) * Math.sin(rad);
    const dLon = (radiusKm / (kmInEqDegrees * Math.cos((centerLat * Math.PI) / 180))) * Math.cos(rad);
    coords.push([centerLon + dLon, centerLat + dLat]);
  }
  return {
    type: 'FeatureCollection',
    features: [{
      type: 'Feature',
      geometry: { type: 'Polygon', coordinates: [coords] }
    }]
  };
}

function computeResults(stations, lat, lon, fuelType, mpg, tankL, radiusKm, excludeCostco = true, excludeMotorway = true) {
  const IMPERIAL_GALLON = 4.54609;
  const litresPerMile = IMPERIAL_GALLON / mpg;
  const candidates = [];
  for (const s of stations) {
    const brand = (s.brand_name || '').toLowerCase();
    const name = (s.trading_name || s.brand_name || '').toLowerCase();
    if (excludeCostco && (name.includes('costco') || brand.includes('costco'))) {
      continue;
    }
    if (excludeMotorway && s.is_motorway_service_station) {
      continue;
    }
    const loc = s.location;
    if (!loc?.latitude || !loc?.longitude) continue;
    const fp = s.fuel_prices?.[fuelType];
    if (!fp?.price) continue;
    const pumpPrice = fp.price;
    const distKm = haversine(lat, lon, loc.latitude, loc.longitude);
    if (distKm > radiusKm) continue;
    const distMiles = distKm * 0.621371;
    const roundTripMiles = distMiles * 2;
    const fuelBurnedL = roundTripMiles * litresPerMile;
    const detourCostP = fuelBurnedL * pumpPrice;
    const effectivePrice = pumpPrice + (detourCostP / tankL);
    candidates.push({
      id: s.node_id,
      name: s.trading_name || s.brand_name || 'Unknown',
      brand: s.brand_name || '',
      address: [s.location.address_line_1, s.location.city, s.location.postcode].filter(Boolean).join(', '),
      lat: loc.latitude,
      lon: loc.longitude,
      distKm,
      distMiles,
      pumpPrice,
      effectivePrice,
      detourCostP,
      fuelBurnedL,
      isSupermarket: s.is_supermarket_service_station,
      isMotorway: s.is_motorway_service_station,
      priceUpdated: fp.price_last_updated,
    });
  }
  return candidates;
}

function fmt_p(v)     { return v.toFixed(1) + 'p'; }
function fmt_tank(v, tankL) { return '£' + ((v * tankL) / 100).toFixed(2); }
function fmt_km(v)    { return v < 1 ? (v * 1000).toFixed(0) + 'm' : v.toFixed(1) + ' km'; }
function fmt_mi(v)    { return v < 0.1 ? (v * 1760).toFixed(0) + ' yd' : v.toFixed(1) + ' mi'; }
function fmt_gbp(v)   { return v >= 0 ? '+\u00a3' + v.toFixed(2) : '\u2212\u00a3' + Math.abs(v).toFixed(2); }
function escHtml(s)   { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function getSaving(s, baselineEffective, tankL) {
  return (baselineEffective - s.effectivePrice) * tankL / 100;
}

function getThArrow(colMode) {
  if (sortMode !== colMode) return '';
  return sortOrder === 'asc' ? ' ▲' : ' ▼';
}

function renderResults() {
  const container = document.getElementById('results');
  const sortBar = document.getElementById('sort-bar');
  const header = document.getElementById('results-header');
  const countEl = document.getElementById('result-count');
  const tankL = parseFloat(document.getElementById('tank').value) || 40;

  if (!myLat || !myLon) {
    sortBar.style.display = 'none';
    header.style.display = 'none';
    container.innerHTML = '<div class="state-msg"><div class="icon">📍</div><strong>Set your location</strong>Click "📍 Locate me" above or click anywhere on the map to find cheap fuel near you.</div>';
    return;
  }

  if (!results.length) {
    sortBar.style.display = 'none';
    header.style.display = 'none';
    container.innerHTML = '<div class="state-msg"><div class="icon">⛽</div><strong>No stations found</strong>Try increasing the search radius or changing the fuel type.</div>';
    return;
  }

  sortBar.style.display = 'flex';
  header.style.display = 'block';
  updateSortButtons();

  const nearest = [...results].sort((a,b) => a.distKm - b.distKm)[0];
  const baselineEffective = nearest.effectivePrice;

  const augmented = results.map(s => {
    const isNearest = s.id === nearest.id;
    const saving = getSaving(s, baselineEffective, tankL);
    let statusClass = 'status-not-worth';
    if (isNearest)          statusClass = 'status-nearest';
    else if (saving > 0.10) statusClass = 'status-worth-it';
    else if (saving > -0.10) statusClass = 'status-breakeven';
    return { ...s, isNearest, saving, statusClass };
  });

  const dir = sortOrder === 'asc' ? 1 : -1;
  augmented.sort((a,b) => {
    if (sortMode === 'effective') return (a.effectivePrice - b.effectivePrice) * dir;
    if (sortMode === 'pump')      return (a.pumpPrice - b.pumpPrice) * dir;
    if (sortMode === 'distance')  return (a.distKm - b.distKm) * dir;
    if (sortMode === 'name')      return a.name.localeCompare(b.name) * dir;
    return (a.effectivePrice - b.effectivePrice) * dir;
  });

  currentAugmented = augmented;

  countEl.textContent = results.length + ' station' + (results.length !== 1 ? 's' : '') + ' found';

  const isTank = displayMode === 'tank';

  let rowsHtml = augmented.map(s => {
    const isSel = s.id === selectedId;
    const pumpMain = isTank ? fmt_tank(s.pumpPrice, tankL) : fmt_p(s.pumpPrice);
    const pumpSub  = isTank ? fmt_p(s.pumpPrice) : fmt_tank(s.pumpPrice, tankL);

    const effMain  = isTank ? fmt_tank(s.effectivePrice, tankL) : fmt_p(s.effectivePrice);
    const effSub   = isTank ? fmt_p(s.effectivePrice) : fmt_tank(s.effectivePrice, tankL);

    return '<tr class="' + s.statusClass + (isSel ? ' selected' : '') + '" data-id="' + escHtml(s.id) + '" data-lat="' + s.lat + '" data-lon="' + s.lon + '">' +
      '<td>' +
        '<div style="font-weight:600;color:var(--text);line-height:1.2">' + escHtml(s.name) + '</div>' +
        '<div style="color:var(--text-muted);font-size:0.7rem;margin-top:2px">' + escHtml(s.brand) + '</div>' +
      '</td>' +
      '<td class="num-col"><strong>' + pumpMain + '</strong><div style="font-size:0.68rem;color:var(--text-muted);margin-top:1px;">' + pumpSub + '</div></td>' +
      '<td class="num-col"><strong style="color:var(--green)">' + effMain + '</strong><div style="font-size:0.68rem;color:var(--text-muted);margin-top:1px;">' + effSub + '</div></td>' +
      '<td class="num-col" style="color:#a5d6ff">' + fmt_mi(s.distMiles) + '</td>' +
    '</tr>';
  }).join('');

  // Mobile cards (shown instead of table on narrow screens)
  let cardsHtml = augmented.map(s => {
    const isSel = s.id === selectedId;
    const pumpMain = isTank ? fmt_tank(s.pumpPrice, tankL) : fmt_p(s.pumpPrice);
    const pumpSub  = isTank ? fmt_p(s.pumpPrice) : fmt_tank(s.pumpPrice, tankL);
    const effMain  = isTank ? fmt_tank(s.effectivePrice, tankL) : fmt_p(s.effectivePrice);
    const effSub   = isTank ? fmt_p(s.effectivePrice) : fmt_tank(s.effectivePrice, tankL);
    return '<div class="station-card ' + s.statusClass + (isSel ? ' selected' : '') + '" data-id="' + escHtml(s.id) + '" data-lat="' + s.lat + '" data-lon="' + s.lon + '" role="button" tabindex="0">' +
      '<div class="card-top">' +
        '<div><div class="card-name">' + escHtml(s.name) + '</div><div class="card-brand">' + escHtml(s.brand) + '</div></div>' +
        '<div class="card-dist">' + fmt_mi(s.distMiles) + '</div>' +
      '</div>' +
      '<div class="card-prices">' +
        '<div class="card-price-block"><span class="card-price-label">Pump</span><span class="card-price-main">' + pumpMain + '</span><span class="card-price-sub">' + pumpSub + '</span></div>' +
        '<div class="card-price-block"><span class="card-price-label">True Cost</span><span class="card-price-main" style="color:var(--green)">' + effMain + '</span><span class="card-price-sub">' + effSub + '</span></div>' +
      '</div>' +
    '</div>';
  }).join('');

  const pumpHeaderStr = isTank ? 'Pump Tank' : 'Pump';
  const effHeaderStr  = isTank ? 'True Tank' : 'True Cost';

  container.innerHTML =
    '<div class="table-wrap"><table class="data-table"><thead><tr>' +
    '<th onclick="setSortMode(\'name\')" class="' + (sortMode === 'name' ? 'active-th' : '') + '">Station' + getThArrow('name') + '</th>' +
    '<th onclick="setSortMode(\'pump\')" class="num-col ' + (sortMode === 'pump' ? 'active-th' : '') + '">' + pumpHeaderStr + getThArrow('pump') + '</th>' +
    '<th onclick="setSortMode(\'effective\')" class="num-col ' + (sortMode === 'effective' ? 'active-th' : '') + '">' + effHeaderStr + getThArrow('effective') + '</th>' +
    '<th onclick="setSortMode(\'distance\')" class="num-col ' + (sortMode === 'distance' ? 'active-th' : '') + '">Distance' + getThArrow('distance') + '</th>' +
    '</tr></thead><tbody>' + rowsHtml + '</tbody></table></div>' +
    '<div class="card-list">' + cardsHtml + '</div>';

  document.querySelectorAll('.data-table tbody tr').forEach(r => {
    r.addEventListener('click', () => {
      selectStation(r.dataset.id, parseFloat(r.dataset.lat), parseFloat(r.dataset.lon));
    });
  });

  document.querySelectorAll('.station-card').forEach(c => {
    const handler = () => {
      selectStation(c.dataset.id, parseFloat(c.dataset.lat), parseFloat(c.dataset.lon));
      // On mobile, selecting a station closes the panel to show the map
      if (mobileSidebarQuery.matches) {
        isSidebarHiddenOnMobile = true;
        syncMobileSidebarState();
      }
    };
    c.addEventListener('click', handler);
    c.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); handler(); } });
  });
}

function initMap() {
  map = new maplibregl.Map({
    container: 'map',
    style: 'https://tiles.openfreemap.org/styles/dark',
    center: [-2.5, 54.5],
    zoom: 5.5,
    pitch: 0,
    attributionControl: false
  });

  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
  map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');

  popup = new maplibregl.Popup({ closeButton: true, closeOnClick: false, offset: 12 });

  map.on('load', () => {
    map.addSource('radius-circle', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    map.addLayer({
      id: 'radius-circle-fill',
      type: 'fill',
      source: 'radius-circle',
      paint: { 'fill-color': '#58a6ff', 'fill-opacity': 0.12 }
    });
    map.addLayer({
      id: 'radius-circle-stroke',
      type: 'line',
      source: 'radius-circle',
      paint: { 'line-color': '#58a6ff', 'line-width': 2, 'line-dasharray': [3, 2] }
    });

    map.addSource('my-location', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    map.addLayer({
      id: 'my-location-halo',
      type: 'circle',
      source: 'my-location',
      paint: { 'circle-radius': 16, 'circle-color': '#58a6ff', 'circle-opacity': 0.25 }
    });
    map.addLayer({
      id: 'my-location-dot',
      type: 'circle',
      source: 'my-location',
      paint: { 'circle-radius': 7, 'circle-color': '#58a6ff', 'circle-stroke-width': 2.5, 'circle-stroke-color': '#ffffff' }
    });

    map.addSource('stations', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    map.addLayer({
      id: 'stations-circle',
      type: 'circle',
      source: 'stations',
      paint: {
        'circle-radius': 7,
        'circle-color': ['get', 'color'],
        'circle-stroke-width': 1.5,
        'circle-stroke-color': 'rgba(255,255,255,0.4)',
        'circle-opacity': 0.9
      }
    });

    map.on('click', 'stations-circle', (e) => {
      const f = e.features[0];
      if (f) selectStation(f.properties.id, f.geometry.coordinates[1], f.geometry.coordinates[0]);
    });
    map.on('mouseenter', 'stations-circle', () => { map.getCanvas().style.cursor = 'pointer'; });
    map.on('mouseleave', 'stations-circle', () => { map.getCanvas().style.cursor = ''; });

    map.on('click', (e) => {
      if (map.queryRenderedFeatures(e.point, { layers: ['stations-circle'] }).length > 0) return;
      document.getElementById('lat').value = e.lngLat.lat.toFixed(6);
      document.getElementById('lon').value = e.lngLat.lng.toFixed(6);
      myLat = e.lngLat.lat; myLon = e.lngLat.lng;
      if (priceData) runSearch();
      else updateMapSource();
    });

    updateMapSource();
  });
}

function updateMapSource() {
  if (!map) return;
  if (!map.isStyleLoaded()) {
    map.once('load', updateMapSource);
    return;
  }
  const radKm = parseFloat(document.getElementById('radius').value) || 15;
  if (myLat && myLon) {
    map.getSource('my-location')?.setData({
      type: 'FeatureCollection',
      features: [{ type: 'Feature', geometry: { type: 'Point', coordinates: [myLon, myLat] } }]
    });
    map.getSource('radius-circle')?.setData(createGeoJSONCircle(myLon, myLat, radKm));
  }
  const colorMap = {
    'status-worth-it': '#3fb950',
    'status-breakeven': '#d29922',
    'status-not-worth': '#f85149',
    'status-nearest':  '#58a6ff'
  };
  const listToRender = currentAugmented.length ? currentAugmented : results;
  const features = listToRender.map(s => ({
    type: 'Feature',
    geometry: { type: 'Point', coordinates: [s.lon, s.lat] },
    properties: { id: s.id, name: s.name, color: colorMap[s.statusClass] || '#58a6ff' }
  }));
  map.getSource('stations')?.setData({ type: 'FeatureCollection', features });

  if (myLat && myLon && results.length > 0) {
    const kmInEqDegrees = 111.32;
    const dLat = radKm / kmInEqDegrees;
    const dLon = radKm / (kmInEqDegrees * Math.cos((myLat * Math.PI) / 180));

    const lons = [myLon - dLon, myLon + dLon];
    const lats = [myLat - dLat, myLat + dLat];
    results.forEach(r => { lons.push(r.lon); lats.push(r.lat); });

    map.fitBounds([
      [Math.min(...lons), Math.min(...lats)],
      [Math.max(...lons), Math.max(...lats)]
    ], { padding: 40, duration: 800 });
  }
}

function selectStation(id, lat, lon) {
  selectedId = id;
  document.querySelectorAll('.data-table tbody tr').forEach(r => r.classList.toggle('selected', r.dataset.id === id));
  document.querySelector('.data-table tbody tr[data-id="' + id + '"]')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  map?.flyTo({ center: [lon, lat], zoom: 14, duration: 700 });
  const s = results.find(r => r.id === id);
  const tankL = parseFloat(document.getElementById('tank').value) || 40;
  if (s && popup && map) {
    popup.setLngLat([lon, lat]).setHTML(
      '<div class="popup-name">' + escHtml(s.name) + '</div>' +
      '<div class="popup-brand">' + escHtml(s.brand) + ' \u00b7 ' + fmt_km(s.distKm) + '</div>' +
      '<div class="popup-prices">' +
        '<div class="popup-price"><span class="popup-price-label">Pump price</span><span class="popup-price-val" style="color:var(--text)">' + fmt_tank(s.pumpPrice, tankL) + ' <span style="font-size:0.75rem;font-weight:400;color:var(--text-muted)">(' + fmt_p(s.pumpPrice) + ')</span></span></div>' +
        '<div class="popup-price"><span class="popup-price-label">True cost</span><span class="popup-price-val" style="color:var(--green)">' + fmt_tank(s.effectivePrice, tankL) + ' <span style="font-size:0.75rem;font-weight:400;color:var(--text-muted)">(' + fmt_p(s.effectivePrice) + ')</span></span></div>' +
      '</div>'
    ).addTo(map);
  }
  if (map?.getLayer('stations-circle')) {
    map.setPaintProperty('stations-circle', 'circle-radius', ['case', ['==', ['get', 'id'], id], 10, 7]);
    map.setPaintProperty('stations-circle', 'circle-stroke-color', ['case', ['==', ['get', 'id'], id], '#ffffff', 'rgba(255,255,255,0.4)']);
  }
}

function runSearch() {
  if (!priceData) return;
  const lat = parseFloat(document.getElementById('lat').value);
  const lon = parseFloat(document.getElementById('lon').value);
  const mpg = parseFloat(document.getElementById('mpg').value);
  const tankL = parseFloat(document.getElementById('tank').value);
  const radius = parseFloat(document.getElementById('radius').value);
  const fuel = document.getElementById('fuel-type').value;
  const excludeCostco = document.getElementById('exclude-costco')?.checked ?? true;
  const excludeMotorway = document.getElementById('exclude-motorway')?.checked ?? true;
  if (isNaN(lat) || isNaN(lon) || isNaN(mpg) || isNaN(tankL) || isNaN(radius)) {
    alert('Please fill in all fields including your location.');
    return;
  }
  myLat = lat; myLon = lon;
  results = computeResults(priceData.stations, lat, lon, fuel, mpg, tankL, radius, excludeCostco, excludeMotorway);
  selectedId = null;
  popup?.remove();
  renderResults();
  updateMapSource();
}

function setDataStatus(label, count) {
  const el = document.getElementById('data-status');
  const text = document.getElementById('data-status-text');
  if (!el) return;
  el.style.display = 'flex';
  el.classList.add('loaded');
  text.textContent = '\u2705 ' + label + (count ? ' \u00b7 ' + count.toLocaleString() + ' stations' : '');
}

function loadFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.stations || !Array.isArray(data.stations)) throw new Error('Invalid format: missing stations array');
      priceData = data;
      setDataStatus(file.name, data.stations.length);
      document.getElementById('btn-search').disabled = false;
      runSearch();
    } catch(err) { alert('Error loading file: ' + err.message); }
  };
  reader.readAsText(file);
}

function locateMe(silent = false) {
  const btn = document.getElementById('btn-locate');
  if (btn) {
    btn.textContent = '⏳ Locating…';
    btn.disabled = true;
  }
  if (!navigator.geolocation) {
    if (btn) { btn.textContent = '📍 Locate me'; btn.disabled = false; }
    if (!silent) alert('Geolocation is not supported by your browser.');
    return;
  }
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      const lat = parseFloat(pos.coords.latitude.toFixed(6));
      const lon = parseFloat(pos.coords.longitude.toFixed(6));
      document.getElementById('lat').value = lat;
      document.getElementById('lon').value = lon;
      myLat = lat;
      myLon = lon;
      if (btn) {
        btn.textContent = '📍 Located ✓';
        btn.disabled = false;
      }
      if (priceData) runSearch();
      else updateMapSource();
    },
    (err) => {
      if (btn) {
        btn.textContent = '📍 Locate me';
        btn.disabled = false;
      }
      if (!silent) alert('Could not get location: ' + err.message);
    },
    { enableHighAccuracy: false, timeout: 6000, maximumAge: 300000 }
  );
}

function setSortMode(mode) {
  if (sortMode === mode) {
    sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
  } else {
    sortMode = mode;
    sortOrder = 'asc';
  }
  updateSortButtons();
  renderResults();
}

function setDisplayMode(mode) {
  displayMode = mode;
  document.getElementById('unit-pence')?.classList.toggle('active', mode === 'pence');
  document.getElementById('unit-tank')?.classList.toggle('active', mode === 'tank');
  renderResults();
}

function setRadius(val) {
  val = Math.min(100, Math.max(1, parseFloat(val) || 15));
  document.getElementById('radius').value = val;
  document.getElementById('radius-slider').value = val;
  document.getElementById('radius-val').textContent = val + ' km';
  document.querySelectorAll('.preset-btn').forEach(b => {
    b.classList.toggle('active', parseFloat(b.dataset.r) === val);
  });
  if (priceData) runSearch();
}

function updateSortButtons() {
  const titles = { effective: 'True Cost', pump: 'Pump Price', distance: 'Distance' };
  ['effective','pump','distance'].forEach(m => {
    const btn = document.getElementById('sort-' + m);
    if (!btn) return;
    const isActive = m === sortMode;
    btn.classList.toggle('active', isActive);
    btn.setAttribute('aria-pressed', String(isActive));
    const arrow = isActive ? (sortOrder === 'asc' ? ' ↑' : ' ↓') : ' ↕';
    btn.textContent = titles[m] + arrow;
  });
}

document.getElementById('file-input').addEventListener('change', (e) => loadFile(e.target.files[0]));
document.getElementById('btn-locate').addEventListener('click', locateMe);
document.getElementById('btn-search').addEventListener('click', runSearch);
document.getElementById('sort-effective').addEventListener('click', () => setSortMode('effective'));
document.getElementById('sort-pump').addEventListener('click', () => setSortMode('pump'));
document.getElementById('sort-distance').addEventListener('click', () => setSortMode('distance'));

// Drag-and-drop onto the data-status bar
const dataStatus = document.getElementById('data-status');
dataStatus.addEventListener('dragover', (e) => { e.preventDefault(); dataStatus.style.borderColor = 'var(--accent)'; });
dataStatus.addEventListener('dragleave', () => { dataStatus.style.borderColor = ''; });
dataStatus.addEventListener('drop', (e) => { e.preventDefault(); dataStatus.style.borderColor = ''; loadFile(e.dataTransfer.files[0]); });

['lat','lon','mpg','tank'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', (e) => { if (e.key === 'Enter' && priceData) runSearch(); });
});

document.getElementById('radius-slider').addEventListener('input', (e) => setRadius(e.target.value));
document.getElementById('radius').addEventListener('input', (e) => setRadius(e.target.value));
document.querySelectorAll('.preset-btn').forEach(b => {
  b.addEventListener('click', () => setRadius(b.dataset.r));
});

document.getElementById('exclude-costco').addEventListener('change', () => { if (priceData) runSearch(); });
document.getElementById('exclude-motorway').addEventListener('change', () => { if (priceData) runSearch(); });
document.getElementById('unit-pence')?.addEventListener('click', () => setDisplayMode('pence'));
document.getElementById('unit-tank')?.addEventListener('click', () => setDisplayMode('tank'));
document.getElementById('mobile-sidebar-toggle').addEventListener('click', toggleMobileSidebar);
mobileSidebarQuery.addEventListener('change', syncMobileSidebarState);

// Attempt to auto-fetch prices_latest.json on load for seamless experience
const tryFetchJson = (url) => fetch(url).then(res => res.ok ? res.json() : null);
const todayStr = new Date().toISOString().split('T')[0];

tryFetchJson('prices_latest.json')
  .then(data => data || tryFetchJson(`prices_${todayStr}.json`))
  .then(data => {
    if (data && data.stations && Array.isArray(data.stations)) {
      priceData = data;
      setDataStatus('prices_latest.json', data.stations.length);
      document.getElementById('btn-search').disabled = false;
      if (myLat && myLon) {
        runSearch();
      }
    } else {
      // Data not available: show the status bar in a neutral state so users can load manually
      const el = document.getElementById('data-status');
      const text = document.getElementById('data-status-text');
      if (el) { el.style.display = 'flex'; text.textContent = '📂 Load price data (JSON)'; }
    }
  })
  .catch(() => {
    const el = document.getElementById('data-status');
    const text = document.getElementById('data-status-text');
    if (el) { el.style.display = 'flex'; text.textContent = '📂 Load price data (JSON)'; }
  });

initMap();
locateMe(true);
syncMobileSidebarState();
</script>
</body>
</html>
