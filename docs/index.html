<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UK True Cost Fuel Finder</title>
  <meta name="description" content="Find the cheapest petrol station near you, accounting for the fuel you'll burn driving there and back.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <script src="https://unpkg.com/maplibre-gl@5/dist/maplibre-gl.js"></script>
  <style>
    :root {
      --bg:          #0d1117;
      --surface:     #161b22;
      --surface2:    #1c2331;
      --surface3:    #21293a;
      --border:      rgba(255,255,255,0.08);
      --border-bright: rgba(255,255,255,0.16);
      --text:        #e6edf3;
      --text-muted:  #7d8590;
      --accent:      #58a6ff;
      --accent-glow: rgba(88,166,255,0.15);
      --green:       #3fb950;
      --green-glow:  rgba(63,185,80,0.15);
      --amber:       #d29922;
      --amber-glow:  rgba(210,153,34,0.12);
      --red:         #f85149;
      --red-glow:    rgba(248,81,73,0.12);
      --radius:      12px;
      --radius-sm:   8px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; font-family: 'Inter', system-ui, sans-serif; background: var(--bg); color: var(--text); font-size: 15px; -webkit-font-smoothing: antialiased; overflow-x: hidden; -webkit-text-size-adjust: 100%; }
    #app { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 1fr); grid-template-rows: 100vh; height: 100vh; min-height: 100dvh; width: 100%; overflow: hidden; }
    #sidebar { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow: hidden; }
    /* ── Mobile panel toggle (shown on map when sidebar is minimized) ── */
    .mobile-sidebar-toggle {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      min-height: 44px;
      padding: 9px 20px;
      border: 1px solid var(--border-bright);
      border-radius: 999px;
      background: rgba(22, 27, 34, 0.95);
      color: var(--text);
      font: inherit;
      font-size: 0.84rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(88,166,255,0.15);
      transition: border-color 0.15s, background 0.15s, box-shadow 0.15s;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      white-space: nowrap;
    }
    .mobile-sidebar-toggle:hover,
    .mobile-sidebar-toggle:focus-visible {
      border-color: var(--accent);
      background: rgba(28, 35, 49, 0.98);
      box-shadow: 0 8px 32px rgba(0,0,0,0.5), 0 0 0 3px var(--accent-glow);
    }
    .mobile-sidebar-toggle:active { opacity: 0.85; }
    /* drag-handle hint at top of sidebar on mobile (tappable to toggle) */
    .sidebar-drag-handle {
      display: none;
      width: 42px;
      height: 4px;
      background: var(--border-bright);
      border-radius: 2px;
      margin: 8px auto 4px;
      flex-shrink: 0;
      cursor: pointer;
      transition: background 0.15s;
    }
    .sidebar-drag-handle:hover { background: var(--accent); }
    #sidebar-header {
      padding: 8px 14px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }
    .logo-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .logo-icon { width: 22px; height: 22px; background: linear-gradient(135deg, #58a6ff, #3fb950); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; flex-shrink: 0; }
    h1 { font-size: 0.88rem; font-weight: 700; background: linear-gradient(135deg, var(--accent), var(--green)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; margin: 0; white-space: nowrap; }
    /* compact data-status pill in header */
    .data-status-badge {
      display: none;
      align-items: center;
      gap: 4px;
      padding: 2px 7px;
      border-radius: 999px;
      background: var(--surface2);
      border: 1px solid var(--border);
      font-size: 0.68rem;
      color: var(--text-muted);
      overflow: hidden;
      cursor: pointer;
      position: relative;
      white-space: nowrap;
      transition: border-color 0.15s, background 0.15s, color 0.15s;
    }
    .data-status-badge:hover { border-color: var(--accent); color: var(--text); }
    .data-status-badge input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; }
    .data-status-badge.loaded { color: var(--green); border-color: rgba(63,185,80,0.35); background: rgba(63,185,80,0.08); }
    #data-status-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* Minimize to map button in header (mobile only) */
    .mobile-close-btn {
      display: none;
      align-items: center;
      gap: 4px;
      background: var(--surface2);
      border: 1px solid var(--border-bright);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: inherit;
      font-size: 0.74rem;
      font-weight: 600;
      padding: 3px 8px;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.15s, background 0.15s;
    }
    .mobile-close-btn:hover { background: var(--surface3); border-color: var(--accent); }

    #controls { padding: 8px 14px 8px; border-bottom: 1px solid var(--border); flex-shrink: 0; display: flex; flex-direction: column; gap: 6px; max-height: 48vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .control-row { display: flex; flex-wrap: wrap; gap: 6px; }
    .control-row.row, .loc-row.row { margin-right: 0; margin-left: 0; }
    .control-row.row > [class^="col"], .control-row.row > [class*=" col"], .loc-row.row > [class^="col"], .loc-row.row > [class*=" col"] {
      padding-right: 0;
      padding-left: 0;
    }
    .field { display: flex; flex-direction: column; gap: 3px; }
    .field.full { width: 100%; }
    label { font-size: 0.7rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
    .input-wrap { position: relative; display: flex; align-items: center; }
    input[type="number"], input[type="text"], select { width: 100%; min-height: 36px; background: var(--surface2); border: 1px solid var(--border-bright); border-radius: var(--radius-sm); color: var(--text); font-family: inherit; font-size: 0.84rem; padding: 6px 8px; outline: none; transition: border-color 0.15s, box-shadow 0.15s; -moz-appearance: textfield; }
    input[type="number"]::-webkit-inner-spin-button, input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type="checkbox"] { width: 16px; height: 16px; accent-color: var(--accent); }
    input:focus, select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    select { cursor: pointer; }
    .unit { position: absolute; right: 8px; font-size: 0.7rem; color: var(--text-muted); pointer-events: none; }
    input.has-unit { padding-right: 40px; }
    .upload-zone { display: none; }

    .loc-search-row {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
    }
    #btn-locate {
      flex-shrink: 0;
      min-height: 32px;
      padding: 0 9px;
      background: var(--surface2);
      border: 1px solid var(--border-bright);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: inherit;
      font-size: 0.76rem;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: border-color 0.15s, background 0.15s;
      white-space: nowrap;
    }
    #btn-locate:hover { border-color: var(--accent); background: var(--accent-glow); }
    .loc-display {
      flex: 1;
      min-width: 0;
      min-height: 32px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 0 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.74rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      user-select: none;
    }
    .loc-display.has-coords {
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.72rem;
      letter-spacing: -0.02em;
    }
    #btn-search {
      flex-shrink: 0;
      min-height: 32px;
      width: auto;
      padding: 0 12px;
      background: linear-gradient(135deg, #1f6feb, #238636);
      border: none;
      border-radius: var(--radius-sm);
      color: #fff;
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.02em;
      white-space: nowrap;
      transition: opacity 0.15s, transform 0.1s;
    }
    #btn-search:hover { opacity: 0.9; }
    #btn-search:active { transform: scale(0.98); }
    #btn-search:disabled { opacity: 0.4; cursor: not-allowed; }

    /* ── Options Drawer (Fuel Type, Radius, MPG, Tank, Filters) ── */
    .options-drawer {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      transition: border-color 0.15s, background 0.15s;
      margin-top: 1px;
    }
    .options-drawer[open] {
      border-color: var(--border-bright);
      background: rgba(28, 35, 49, 0.7);
    }
    .options-summary {
      list-style: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 9px;
      cursor: pointer;
      user-select: none;
      font-size: 0.76rem;
      color: var(--text-muted);
      transition: color 0.15s, background 0.15s;
    }
    .options-summary::-webkit-details-marker { display: none; }
    .options-summary:hover { color: var(--text); }
    .summary-label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
    }
    .summary-badge {
      font-size: 0.68rem;
      background: var(--surface3);
      padding: 2px 7px;
      border-radius: 999px;
      color: var(--accent);
      border: 1px solid rgba(88, 166, 255, 0.2);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
    }
    .summary-chevron {
      font-size: 0.72rem;
      transition: transform 0.2s ease;
      color: var(--text-muted);
      flex-shrink: 0;
    }
    .options-drawer[open] .summary-chevron { transform: rotate(180deg); }
    .drawer-body {
      padding: 8px 10px 10px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .filter-check-label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      text-transform: none;
      font-size: 0.78rem;
      color: var(--text);
      font-weight: 500;
    }
    .field-val-highlight { color: var(--accent); font-weight: 700; font-size: 0.74rem; }

    #results-header { padding: 8px 14px 6px; flex-shrink: 0; }
    #result-count { font-size: 0.78rem; color: var(--text-muted); }
    .unit-btn { min-height: 26px; padding: 2px 8px; background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; color: var(--text-muted); font-family: inherit; font-size: 0.72rem; font-weight: 500; cursor: pointer; transition: all 0.15s; }
    .unit-btn.active { background: var(--accent-glow); border-color: var(--accent); color: var(--accent); }

    .preset-btn { min-height: 28px; padding: 2px 7px; background: var(--surface2); border: 1px solid var(--border); border-radius: 4px; color: var(--text-muted); font-family: inherit; font-size: 0.68rem; font-weight: 600; cursor: pointer; transition: all 0.15s; }
    .preset-btn:hover { border-color: var(--accent); color: var(--text); }
    .preset-btn.active { background: var(--accent-glow); border-color: var(--accent); color: var(--accent); }
    input[type="range"] { accent-color: var(--accent); height: 5px; border-radius: 3px; background: var(--surface2); outline: none; }

    #results {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      padding: 0 10px 14px;
    }
    #results::-webkit-scrollbar { width: 5px; }
    #results::-webkit-scrollbar-track { background: transparent; }
    #results::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 3px; }

    /* ── Table layout & interactive sort headers ── */
    .table-wrap {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface2);
    }
    .data-table {
      width: 100%;
      min-width: 310px;
      border-collapse: collapse;
      font-size: 0.8rem;
      text-align: left;
    }
    .data-table th {
      position: sticky;
      top: 0;
      z-index: 2;
      background: var(--surface3);
      color: var(--text-muted);
      padding: 8px 8px;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      border-bottom: 1px solid var(--border-bright);
      user-select: none;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      transition: color 0.15s, background 0.15s;
      white-space: nowrap;
    }
    .data-table th:hover { color: var(--text); background: var(--surface2); }
    .data-table th.active-th { color: var(--accent); background: rgba(88,166,255,0.08); border-bottom-color: var(--accent); }
    .data-table th .th-wrap { display: inline-flex; align-items: center; gap: 4px; }
    .data-table th.num-col .th-wrap { justify-content: flex-end; width: 100%; }
    .data-table th .sort-indicator { font-size: 0.72rem; opacity: 0.4; }
    .data-table th.active-th .sort-indicator { opacity: 1; color: var(--accent); font-weight: 700; }

    .data-table th.num-col, .data-table td.num-col { text-align: right; white-space: nowrap; }
    .data-table td { padding: 8px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    .data-table tr { cursor: pointer; transition: background 0.15s; }
    .data-table tr:hover { background: var(--surface3); }
    .data-table tr.selected { background: var(--surface3); outline: 1px solid var(--accent); }

    .data-table tr.status-worth-it td:first-child { border-left: 4px solid var(--green); }
    .data-table tr.status-breakeven td:first-child { border-left: 4px solid var(--amber); }
    .data-table tr.status-not-worth td:first-child { border-left: 4px solid var(--red); }
    .data-table tr.status-nearest td:first-child { border-left: 4px solid var(--accent); }

    .data-table tr.status-worth-it { background: rgba(63, 185, 80, 0.04); }
    .data-table tr.status-breakeven { background: rgba(210, 153, 34, 0.04); }
    .data-table tr.status-not-worth { background: rgba(248, 81, 73, 0.04); }
    .data-table tr.status-nearest { background: rgba(88, 166, 255, 0.04); }

    .state-msg { text-align: center; padding: 36px 16px; color: var(--text-muted); font-size: 0.84rem; line-height: 1.6; }
    .state-msg .icon { font-size: 2.2rem; margin-bottom: 10px; }
    .state-msg strong { display: block; color: var(--text); margin-bottom: 5px; font-size: 0.92rem; }
    #map { width: 100%; height: 100%; }
    .maplibregl-popup-content { background: var(--surface2) !important; border: 1px solid var(--border-bright) !important; border-radius: var(--radius-sm) !important; color: var(--text) !important; box-shadow: 0 8px 32px rgba(0,0,0,0.5) !important; padding: 12px 14px !important; font-family: 'Inter', sans-serif !important; min-width: 200px; }
    .maplibregl-popup-tip { display: none !important; }
    .maplibregl-popup-close-button { color: var(--text-muted) !important; font-size: 16px !important; right: 8px !important; top: 6px !important; }
    .popup-name { font-weight: 600; font-size: 0.85rem; margin-bottom: 3px; }
    .popup-brand { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; }
    .popup-prices { display: flex; gap: 12px; }
    .popup-price { display: flex; flex-direction: column; gap: 1px; }
    .popup-price-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); }
    .popup-price-val { font-size: 1rem; font-weight: 700; }

    /* ── Responsive: tablet & mobile (< 992px) ── */
    @media (max-width: 991.98px) {
      #app {
        grid-template-columns: 1fr;
        grid-template-rows: minmax(28vh, 1fr) auto;
        height: 100dvh;
        overflow: hidden;
      }
      #map { min-height: 28vh; height: 100%; order: -1; }
      #sidebar {
        border-right: 0;
        border-top: 1px solid var(--border);
        height: 68vh;
        max-height: 72vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      /* Sidebar hidden = full-screen map */
      #app.sidebar-hidden { grid-template-rows: 1fr 0; }
      #app.sidebar-hidden #sidebar { height: 0; max-height: 0; overflow: hidden; border-top: 0; }
      .sidebar-drag-handle { display: block; }
      .mobile-close-btn { display: inline-flex; }
      /* Hide the floating toggle when sidebar is open so it NEVER obscures the table */
      #app:not(.sidebar-hidden) .mobile-sidebar-toggle { display: none !important; }
      #controls { max-height: 42vh; overflow-y: auto; -webkit-overflow-scrolling: touch; }
      #results { flex: 1; min-height: 0; overflow-y: auto; padding: 0 8px 14px; }
    }
    /* Desktop: hide mobile elements */
    @media (min-width: 992px) {
      .mobile-sidebar-toggle { display: none !important; }
      .sidebar-drag-handle { display: none !important; }
      .mobile-close-btn { display: none !important; }
    }
    /* ── Phone (< 576px) ── */
    @media (max-width: 575.98px) {
      #sidebar-header, #controls, #results-header { padding-left: 8px; padding-right: 8px; }
      #results { padding: 0 6px 12px; }
      .data-table th, .data-table td { padding: 6px 4px; }
      .data-table { min-width: 290px; font-size: 0.74rem; }
      /* Prevent iOS auto-zoom on focus */
      input[type="number"], input[type="text"], select { font-size: 16px; min-height: 32px; }
      #btn-search { min-height: 32px; font-size: 0.78rem; padding: 0 10px; }
      #btn-locate { min-height: 32px; font-size: 0.72rem; padding: 0 8px; }
      .loc-display { min-height: 32px; font-size: 0.7rem; }
    }
  </style>
</head>
<body>
<div id="app" class="container-fluid p-0">
  <button
    type="button"
    id="mobile-sidebar-toggle"
    class="mobile-sidebar-toggle"
    aria-controls="sidebar"
    aria-expanded="false"
    aria-label="Show filters and station list"
  >⛽ Results & Filters</button>
  <div id="sidebar">
    <div class="sidebar-drag-handle" id="sidebar-drag-handle" aria-label="Toggle panel" role="button" tabindex="0"></div>
    <div id="sidebar-header">
      <div class="logo-row">
        <div class="logo-icon">⛽</div>
        <h1>True Cost Fuel Finder</h1>
        <div id="data-status" class="data-status-badge" role="button" aria-label="Change price data file" title="Click to load a different JSON file">
          <input type="file" id="file-input" accept=".json" aria-label="Load prices JSON file">
          <span id="data-status-text">⏳ Loading…</span>
        </div>
      </div>
      <button type="button" id="btn-minimize-panel" class="mobile-close-btn" aria-label="Minimize panel to map">
        <span>🗺️ Map</span>
      </button>
    </div>
    <div id="controls">
      <!-- Location & Search bar (No manual text entry: use Locate Me or tap map) -->
      <div class="loc-search-row">
        <button id="btn-locate" type="button" title="Use current GPS location" aria-label="Detect my location">📍 Locate me</button>
        <div id="loc-display" class="loc-display" title="Location set by GPS or map tap">Tap map or locate</div>
        <button id="btn-search" disabled>Find Fuel</button>
      </div>

      <!-- Hidden drawer by default for fuel type, radius, MPG, tank size, and filters -->
      <details class="options-drawer" id="options-drawer">
        <summary class="options-summary">
          <span class="summary-label">
            <span class="summary-icon">⚙️</span>
            <span>Options</span>
          </span>
          <span class="summary-badge" id="options-summary-badge">E10 · 15 km · 40 mpg · 40 L</span>
          <span class="summary-chevron" aria-hidden="true">▾</span>
        </summary>
        <div class="drawer-body">
          <!-- Fuel Type inside Options defaulting to E10 -->
          <div class="field">
            <label for="fuel-type">Fuel Type</label>
            <select id="fuel-type" aria-label="Fuel type">
              <option value="E10" selected>E10 (Petrol)</option>
              <option value="E5">E5 (Premium Petrol)</option>
              <option value="B7_STANDARD">B7 (Diesel)</option>
              <option value="B7_PREMIUM">B7 Premium</option>
              <option value="HVO">HVO</option>
            </select>
          </div>

          <!-- Search Radius -->
          <div class="field">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label for="radius">Search Radius</label>
              <span id="radius-val" class="field-val-highlight">15 km</span>
            </div>
            <div class="input-wrap mb-2">
              <input type="number" id="radius" value="15" min="1" max="100" class="has-unit" aria-label="Search radius in km">
              <span class="unit">km</span>
            </div>
            <div class="d-flex flex-column flex-sm-row align-items-stretch align-items-sm-center gap-2">
              <input type="range" id="radius-slider" value="15" min="1" max="100" step="1" aria-label="Radius slider" style="flex:1;cursor:pointer;">
              <div class="radius-presets d-flex flex-wrap gap-1">
                <button type="button" class="preset-btn" data-r="5">5k</button>
                <button type="button" class="preset-btn" data-r="10">10k</button>
                <button type="button" class="preset-btn active" data-r="15">15k</button>
                <button type="button" class="preset-btn" data-r="25">25k</button>
                <button type="button" class="preset-btn" data-r="50">50k</button>
              </div>
            </div>
          </div>

          <!-- Vehicle Economics: MPG & Tank -->
          <div class="row g-2">
            <div class="field col-6">
              <label for="mpg">Your MPG</label>
              <div class="input-wrap">
                <input type="number" id="mpg" value="40" min="1" max="200" step="0.5" class="has-unit" aria-label="Vehicle fuel economy in MPG">
                <span class="unit">mpg</span>
              </div>
            </div>
            <div class="field col-6">
              <label for="tank">Tank Fill</label>
              <div class="input-wrap">
                <input type="number" id="tank" value="40" min="1" max="200" step="1" class="has-unit" aria-label="Litres to fill">
                <span class="unit">L</span>
              </div>
            </div>
          </div>

          <!-- Filters: Costco & Motorway -->
          <div class="field d-flex flex-column gap-2 pt-1">
            <label class="filter-check-label">
              <input type="checkbox" id="exclude-costco" checked>
              <span>Exclude Costco <span style="font-size:0.75rem;color:var(--text-muted);">(membership)</span></span>
            </label>
            <label class="filter-check-label">
              <input type="checkbox" id="exclude-motorway" checked>
              <span>Exclude Motorway Services 🛣️</span>
            </label>
          </div>
        </div>
      </details>
    </div>
    <div id="results-header" style="display:none;">
      <div class="d-flex justify-content-between align-items-center">
        <div id="result-count"></div>
        <div class="btn-group-toggle d-flex gap-1" role="group" aria-label="Price format">
          <button class="unit-btn active" id="unit-tank" title="Show total price for a full tank in pounds">Full Tank (£)</button>
          <button class="unit-btn" id="unit-pence" title="Show price in pence per litre">p/L</button>
        </div>
      </div>
    </div>
    <div id="results">
      <div class="state-msg">
        <div class="icon">⛽</div>
        <strong>Load your price data to start</strong>
        Auto-loading <code>prices_latest.json</code> or upload a JSON file to start searching.
      </div>
    </div>
  </div>
  <div id="map"></div>
</div>
<script>
'use strict';

let priceData = null;
let myLat = null;
let myLon = null;
let results = [];
let currentAugmented = [];
let sortMode = 'effective';
let sortOrder = 'asc';
let displayMode = 'tank'; // 'tank' or 'pence'
let selectedId = null;
let map = null;
let popup = null;
let isSidebarHiddenOnMobile = true; // map-first on mobile by default
const mobileSidebarQuery = window.matchMedia('(max-width: 991.98px)');

function updateDrawerSummary() {
  const fuel = document.getElementById('fuel-type')?.value || 'E10';
  const fuelLabel = fuel === 'B7_STANDARD' ? 'B7' : fuel === 'B7_PREMIUM' ? 'B7 Prem' : fuel;
  const r = document.getElementById('radius')?.value || 15;
  const mpg = document.getElementById('mpg')?.value || 40;
  const tank = document.getElementById('tank')?.value || 40;
  const costco = document.getElementById('exclude-costco')?.checked ?? true;
  const motorway = document.getElementById('exclude-motorway')?.checked ?? true;
  const parts = [fuelLabel, r + ' km', mpg + ' mpg', tank + ' L'];
  if (!costco) parts.push('+Costco');
  if (!motorway) parts.push('+Motorway');
  const badge = document.getElementById('options-summary-badge');
  if (badge) badge.textContent = parts.join(' · ');
}

function syncMobileSidebarState() {
  const app = document.getElementById('app');
  const toggle = document.getElementById('mobile-sidebar-toggle');
  const hidden = mobileSidebarQuery.matches && isSidebarHiddenOnMobile;
  app.classList.toggle('sidebar-hidden', hidden);
  toggle.setAttribute('aria-expanded', String(!hidden));
  const countStr = results.length ? ' (' + results.length + ')' : '';
  toggle.setAttribute('aria-label', hidden ? 'Show filters and station list' : 'Hide filters and station list');
  toggle.innerHTML = '⛽ Results & Filters' + countStr;
  requestAnimationFrame(() => map?.resize());
}

function toggleMobileSidebar() {
  if (!mobileSidebarQuery.matches) return;
  isSidebarHiddenOnMobile = !isSidebarHiddenOnMobile;
  syncMobileSidebarState();
}

function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1 * Math.PI/180) * Math.cos(lat2 * Math.PI/180) * Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function createGeoJSONCircle(centerLon, centerLat, radiusKm, points = 128) {
  const coords = [];
  const kmInEqDegrees = 111.32;
  for (let i = 0; i <= points; i++) {
    const angle = (i * 360) / points;
    const rad = (angle * Math.PI) / 180;
    const dLat = (radiusKm / kmInEqDegrees) * Math.sin(rad);
    const dLon = (radiusKm / (kmInEqDegrees * Math.cos((centerLat * Math.PI) / 180))) * Math.cos(rad);
    coords.push([centerLon + dLon, centerLat + dLat]);
  }
  return {
    type: 'FeatureCollection',
    features: [{
      type: 'Feature',
      geometry: { type: 'Polygon', coordinates: [coords] }
    }]
  };
}

function computeResults(stations, lat, lon, fuelType, mpg, tankL, radiusKm, excludeCostco = true, excludeMotorway = true) {
  const IMPERIAL_GALLON = 4.54609;
  const litresPerMile = IMPERIAL_GALLON / mpg;
  const candidates = [];
  for (const s of stations) {
    const brand = (s.brand_name || '').toLowerCase();
    const name = (s.trading_name || s.brand_name || '').toLowerCase();
    if (excludeCostco && (name.includes('costco') || brand.includes('costco'))) {
      continue;
    }
    if (excludeMotorway && s.is_motorway_service_station) {
      continue;
    }
    const loc = s.location;
    if (!loc?.latitude || !loc?.longitude) continue;
    const fp = s.fuel_prices?.[fuelType];
    if (!fp?.price) continue;
    const pumpPrice = fp.price;
    const distKm = haversine(lat, lon, loc.latitude, loc.longitude);
    if (distKm > radiusKm) continue;
    const distMiles = distKm * 0.621371;
    const roundTripMiles = distMiles * 2;
    const fuelBurnedL = roundTripMiles * litresPerMile;
    const detourCostP = fuelBurnedL * pumpPrice;
    const effectivePrice = pumpPrice + (detourCostP / tankL);
    candidates.push({
      id: s.node_id,
      name: s.trading_name || s.brand_name || 'Unknown',
      brand: s.brand_name || '',
      address: [s.location.address_line_1, s.location.city, s.location.postcode].filter(Boolean).join(', '),
      lat: loc.latitude,
      lon: loc.longitude,
      distKm,
      distMiles,
      pumpPrice,
      effectivePrice,
      detourCostP,
      fuelBurnedL,
      isSupermarket: s.is_supermarket_service_station,
      isMotorway: s.is_motorway_service_station,
      priceUpdated: fp.price_last_updated,
    });
  }
  return candidates;
}

function fmt_p(v)     { return v.toFixed(1) + 'p'; }
function fmt_tank(v, tankL) { return '£' + ((v * tankL) / 100).toFixed(2); }
function fmt_km(v)    { return v < 1 ? (v * 1000).toFixed(0) + 'm' : v.toFixed(1) + ' km'; }
function fmt_mi(v)    { return v < 0.1 ? (v * 1760).toFixed(0) + ' yd' : v.toFixed(1) + ' mi'; }
function fmt_gbp(v)   { return v >= 0 ? '+\u00a3' + v.toFixed(2) : '\u2212\u00a3' + Math.abs(v).toFixed(2); }
function escHtml(s)   { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function getSaving(s, baselineEffective, tankL) {
  return (baselineEffective - s.effectivePrice) * tankL / 100;
}

function getThArrow(colMode) {
  if (sortMode !== colMode) return '<span class="sort-indicator">↕</span>';
  return '<span class="sort-indicator">' + (sortOrder === 'asc' ? '▲' : '▼') + '</span>';
}

function renderResults() {
  const container = document.getElementById('results');
  const header = document.getElementById('results-header');
  const countEl = document.getElementById('result-count');
  const tankL = parseFloat(document.getElementById('tank').value) || 40;

  if (!myLat || !myLon) {
    header.style.display = 'none';
    container.innerHTML = '<div class="state-msg"><div class="icon">📍</div><strong>Set your location</strong>Click "📍 Locate me" above or click anywhere on the map to find cheap fuel near you.</div>';
    return;
  }

  if (!results.length) {
    header.style.display = 'none';
    container.innerHTML = '<div class="state-msg"><div class="icon">⛽</div><strong>No stations found</strong>Try increasing the search radius or changing the fuel type.</div>';
    return;
  }

  header.style.display = 'block';

  const nearest = [...results].sort((a,b) => a.distKm - b.distKm)[0];
  const baselineEffective = nearest.effectivePrice;

  const augmented = results.map(s => {
    const isNearest = s.id === nearest.id;
    const saving = getSaving(s, baselineEffective, tankL);
    let statusClass = 'status-not-worth';
    if (isNearest)          statusClass = 'status-nearest';
    else if (saving > 0.10) statusClass = 'status-worth-it';
    else if (saving > -0.10) statusClass = 'status-breakeven';
    return { ...s, isNearest, saving, statusClass };
  });

  const dir = sortOrder === 'asc' ? 1 : -1;
  augmented.sort((a,b) => {
    if (sortMode === 'effective') return (a.effectivePrice - b.effectivePrice) * dir;
    if (sortMode === 'pump')      return (a.pumpPrice - b.pumpPrice) * dir;
    if (sortMode === 'distance')  return (a.distKm - b.distKm) * dir;
    if (sortMode === 'name')      return a.name.localeCompare(b.name) * dir;
    return (a.effectivePrice - b.effectivePrice) * dir;
  });

  currentAugmented = augmented;

  countEl.textContent = results.length + ' station' + (results.length !== 1 ? 's' : '') + ' found';

  const isTank = displayMode === 'tank';

  let rowsHtml = augmented.map(s => {
    const isSel = s.id === selectedId;
    const pumpMain = isTank ? fmt_tank(s.pumpPrice, tankL) : fmt_p(s.pumpPrice);
    const pumpSub  = isTank ? fmt_p(s.pumpPrice) : fmt_tank(s.pumpPrice, tankL);

    const effMain  = isTank ? fmt_tank(s.effectivePrice, tankL) : fmt_p(s.effectivePrice);
    const effSub   = isTank ? fmt_p(s.effectivePrice) : fmt_tank(s.effectivePrice, tankL);

    return '<tr class="' + s.statusClass + (isSel ? ' selected' : '') + '" data-id="' + escHtml(s.id) + '" data-lat="' + s.lat + '" data-lon="' + s.lon + '">' +
      '<td>' +
        '<div style="font-weight:600;color:var(--text);line-height:1.2">' + escHtml(s.name) + '</div>' +
        '<div style="color:var(--text-muted);font-size:0.7rem;margin-top:2px">' + escHtml(s.brand) + '</div>' +
      '</td>' +
      '<td class="num-col"><strong>' + pumpMain + '</strong><div style="font-size:0.68rem;color:var(--text-muted);margin-top:1px;">' + pumpSub + '</div></td>' +
      '<td class="num-col"><strong style="color:var(--green)">' + effMain + '</strong><div style="font-size:0.68rem;color:var(--text-muted);margin-top:1px;">' + effSub + '</div></td>' +
      '<td class="num-col" style="color:#a5d6ff">' + fmt_mi(s.distMiles) + '</td>' +
    '</tr>';
  }).join('');

  const pumpHeaderStr = isTank ? 'Pump Tank' : 'Pump Price';
  const effHeaderStr  = isTank ? 'True Tank' : 'True Cost';

  container.innerHTML =
    '<div class="table-wrap"><table class="data-table" role="grid"><thead><tr>' +
    '<th scope="col" onclick="setSortMode(\'name\')" class="' + (sortMode === 'name' ? 'active-th' : '') + '" aria-sort="' + (sortMode === 'name' ? (sortOrder === 'asc' ? 'ascending' : 'descending') : 'none') + '"><div class="th-wrap"><span>Station</span> ' + getThArrow('name') + '</div></th>' +
    '<th scope="col" onclick="setSortMode(\'pump\')" class="num-col ' + (sortMode === 'pump' ? 'active-th' : '') + '" aria-sort="' + (sortMode === 'pump' ? (sortOrder === 'asc' ? 'ascending' : 'descending') : 'none') + '"><div class="th-wrap"><span>' + pumpHeaderStr + '</span> ' + getThArrow('pump') + '</div></th>' +
    '<th scope="col" onclick="setSortMode(\'effective\')" class="num-col ' + (sortMode === 'effective' ? 'active-th' : '') + '" aria-sort="' + (sortMode === 'effective' ? (sortOrder === 'asc' ? 'ascending' : 'descending') : 'none') + '"><div class="th-wrap"><span>' + effHeaderStr + '</span> ' + getThArrow('effective') + '</div></th>' +
    '<th scope="col" onclick="setSortMode(\'distance\')" class="num-col ' + (sortMode === 'distance' ? 'active-th' : '') + '" aria-sort="' + (sortMode === 'distance' ? (sortOrder === 'asc' ? 'ascending' : 'descending') : 'none') + '"><div class="th-wrap"><span>Distance</span> ' + getThArrow('distance') + '</div></th>' +
    '</tr></thead><tbody>' + rowsHtml + '</tbody></table></div>';

  document.querySelectorAll('.data-table tbody tr').forEach(r => {
    r.addEventListener('click', () => {
      selectStation(r.dataset.id, parseFloat(r.dataset.lat), parseFloat(r.dataset.lon));
      // On mobile, selecting a station minimizes the panel to show the map and station pin
      if (mobileSidebarQuery.matches) {
        isSidebarHiddenOnMobile = true;
        syncMobileSidebarState();
      }
    });
  });
}

function initMap() {
  map = new maplibregl.Map({
    container: 'map',
    style: 'https://tiles.openfreemap.org/styles/dark',
    center: [-2.5, 54.5],
    zoom: 5.5,
    pitch: 0,
    attributionControl: false
  });

  map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'top-right');
  map.addControl(new maplibregl.AttributionControl({ compact: true }), 'bottom-right');

  popup = new maplibregl.Popup({ closeButton: true, closeOnClick: false, offset: 12 });

  map.on('load', () => {
    map.addSource('radius-circle', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    map.addLayer({
      id: 'radius-circle-fill',
      type: 'fill',
      source: 'radius-circle',
      paint: { 'fill-color': '#58a6ff', 'fill-opacity': 0.12 }
    });
    map.addLayer({
      id: 'radius-circle-stroke',
      type: 'line',
      source: 'radius-circle',
      paint: { 'line-color': '#58a6ff', 'line-width': 2, 'line-dasharray': [3, 2] }
    });

    map.addSource('my-location', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    map.addLayer({
      id: 'my-location-halo',
      type: 'circle',
      source: 'my-location',
      paint: { 'circle-radius': 16, 'circle-color': '#58a6ff', 'circle-opacity': 0.25 }
    });
    map.addLayer({
      id: 'my-location-dot',
      type: 'circle',
      source: 'my-location',
      paint: { 'circle-radius': 7, 'circle-color': '#58a6ff', 'circle-stroke-width': 2.5, 'circle-stroke-color': '#ffffff' }
    });

    map.addSource('stations', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
    map.addLayer({
      id: 'stations-circle',
      type: 'circle',
      source: 'stations',
      paint: {
        'circle-radius': 7,
        'circle-color': ['get', 'color'],
        'circle-stroke-width': 1.5,
        'circle-stroke-color': 'rgba(255,255,255,0.4)',
        'circle-opacity': 0.9
      }
    });

    map.on('click', 'stations-circle', (e) => {
      const f = e.features[0];
      if (f) selectStation(f.properties.id, f.geometry.coordinates[1], f.geometry.coordinates[0]);
    });
    map.on('mouseenter', 'stations-circle', () => { map.getCanvas().style.cursor = 'pointer'; });
    map.on('mouseleave', 'stations-circle', () => { map.getCanvas().style.cursor = ''; });

    map.on('click', (e) => {
      if (map.queryRenderedFeatures(e.point, { layers: ['stations-circle'] }).length > 0) return;
      myLat = e.lngLat.lat;
      myLon = e.lngLat.lng;
      updateLocationDisplay(myLat, myLon);
      if (priceData) runSearch();
      else updateMapSource();
    });

    updateMapSource();
  });
}

function updateMapSource() {
  if (!map) return;
  if (!map.isStyleLoaded()) {
    map.once('load', updateMapSource);
    return;
  }
  const radKm = parseFloat(document.getElementById('radius').value) || 15;
  if (myLat && myLon) {
    map.getSource('my-location')?.setData({
      type: 'FeatureCollection',
      features: [{ type: 'Feature', geometry: { type: 'Point', coordinates: [myLon, myLat] } }]
    });
    map.getSource('radius-circle')?.setData(createGeoJSONCircle(myLon, myLat, radKm));
  }
  const colorMap = {
    'status-worth-it': '#3fb950',
    'status-breakeven': '#d29922',
    'status-not-worth': '#f85149',
    'status-nearest':  '#58a6ff'
  };
  const listToRender = currentAugmented.length ? currentAugmented : results;
  const features = listToRender.map(s => ({
    type: 'Feature',
    geometry: { type: 'Point', coordinates: [s.lon, s.lat] },
    properties: { id: s.id, name: s.name, color: colorMap[s.statusClass] || '#58a6ff' }
  }));
  map.getSource('stations')?.setData({ type: 'FeatureCollection', features });

  if (myLat && myLon && results.length > 0) {
    const kmInEqDegrees = 111.32;
    const dLat = radKm / kmInEqDegrees;
    const dLon = radKm / (kmInEqDegrees * Math.cos((myLat * Math.PI) / 180));

    const lons = [myLon - dLon, myLon + dLon];
    const lats = [myLat - dLat, myLat + dLat];
    results.forEach(r => { lons.push(r.lon); lats.push(r.lat); });

    map.fitBounds([
      [Math.min(...lons), Math.min(...lats)],
      [Math.max(...lons), Math.max(...lats)]
    ], { padding: 40, duration: 800 });
  }
}

function selectStation(id, lat, lon) {
  selectedId = id;
  document.querySelectorAll('.data-table tbody tr').forEach(r => r.classList.toggle('selected', r.dataset.id === id));
  document.querySelector('.data-table tbody tr[data-id="' + id + '"]')?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  map?.flyTo({ center: [lon, lat], zoom: 14, duration: 700 });
  const s = results.find(r => r.id === id);
  const tankL = parseFloat(document.getElementById('tank').value) || 40;
  if (s && popup && map) {
    popup.setLngLat([lon, lat]).setHTML(
      '<div class="popup-name">' + escHtml(s.name) + '</div>' +
      '<div class="popup-brand">' + escHtml(s.brand) + ' \u00b7 ' + fmt_km(s.distKm) + '</div>' +
      '<div class="popup-prices">' +
        '<div class="popup-price"><span class="popup-price-label">Pump price</span><span class="popup-price-val" style="color:var(--text)">' + fmt_tank(s.pumpPrice, tankL) + ' <span style="font-size:0.75rem;font-weight:400;color:var(--text-muted)">(' + fmt_p(s.pumpPrice) + ')</span></span></div>' +
        '<div class="popup-price"><span class="popup-price-label">True cost</span><span class="popup-price-val" style="color:var(--green)">' + fmt_tank(s.effectivePrice, tankL) + ' <span style="font-size:0.75rem;font-weight:400;color:var(--text-muted)">(' + fmt_p(s.effectivePrice) + ')</span></span></div>' +
      '</div>'
    ).addTo(map);
  }
  if (map?.getLayer('stations-circle')) {
    map.setPaintProperty('stations-circle', 'circle-radius', ['case', ['==', ['get', 'id'], id], 10, 7]);
    map.setPaintProperty('stations-circle', 'circle-stroke-color', ['case', ['==', ['get', 'id'], id], '#ffffff', 'rgba(255,255,255,0.4)']);
  }
}

function updateLocationDisplay(lat, lon) {
  const el = document.getElementById('loc-display');
  if (!el) return;
  if (lat != null && lon != null) {
    el.textContent = lat.toFixed(4) + ', ' + lon.toFixed(4);
    el.title = 'Lat: ' + lat.toFixed(6) + ', Lon: ' + lon.toFixed(6) + ' (tap map to change)';
    el.classList.add('has-coords');
  } else {
    el.textContent = 'Tap map or locate';
    el.title = 'Click "📍 Locate me" or tap the map to choose a search location';
    el.classList.remove('has-coords');
  }
}

function runSearch() {
  if (!priceData) return;
  if (myLat == null || myLon == null) {
    alert('Please choose a location by tapping "📍 Locate me" or clicking on the map.');
    return;
  }
  const mpg = parseFloat(document.getElementById('mpg').value);
  const tankL = parseFloat(document.getElementById('tank').value);
  const radius = parseFloat(document.getElementById('radius').value);
  const fuel = document.getElementById('fuel-type').value;
  const excludeCostco = document.getElementById('exclude-costco')?.checked ?? true;
  const excludeMotorway = document.getElementById('exclude-motorway')?.checked ?? true;
  if (isNaN(mpg) || isNaN(tankL) || isNaN(radius)) {
    alert('Please check your vehicle economics options.');
    return;
  }
  results = computeResults(priceData.stations, myLat, myLon, fuel, mpg, tankL, radius, excludeCostco, excludeMotorway);
  selectedId = null;
  popup?.remove();
  renderResults();
  updateMapSource();
}

function setDataStatus(label, count) {
  const el = document.getElementById('data-status');
  const text = document.getElementById('data-status-text');
  if (!el) return;
  el.style.display = 'inline-flex';
  el.classList.add('loaded');
  const countStr = count ? (count >= 1000 ? (count / 1000).toFixed(1) + 'k' : count) + ' stns' : 'Ready';
  text.textContent = '● ' + countStr;
  el.title = label + (count ? ' (' + count.toLocaleString() + ' stations)' : '') + ' · Click to load JSON file';
}

function loadFile(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (!data.stations || !Array.isArray(data.stations)) throw new Error('Invalid format: missing stations array');
      priceData = data;
      setDataStatus(file.name, data.stations.length);
      document.getElementById('btn-search').disabled = false;
      runSearch();
    } catch(err) { alert('Error loading file: ' + err.message); }
  };
  reader.readAsText(file);
}

function locateMe(silent = false) {
  const btn = document.getElementById('btn-locate');
  if (btn) {
    btn.textContent = '⏳ Locating…';
    btn.disabled = true;
  }
  if (!navigator.geolocation) {
    if (btn) { btn.textContent = '📍 Locate me'; btn.disabled = false; }
    if (!silent) alert('Geolocation is not supported by your browser.');
    return;
  }
  navigator.geolocation.getCurrentPosition(
    (pos) => {
      myLat = parseFloat(pos.coords.latitude.toFixed(6));
      myLon = parseFloat(pos.coords.longitude.toFixed(6));
      updateLocationDisplay(myLat, myLon);
      if (btn) {
        btn.textContent = '📍 Located ✓';
        btn.disabled = false;
      }
      if (priceData) runSearch();
      else updateMapSource();
    },
    (err) => {
      if (btn) {
        btn.textContent = '📍 Locate me';
        btn.disabled = false;
      }
      if (!silent) alert('Could not get location: ' + err.message);
    },
    { enableHighAccuracy: false, timeout: 6000, maximumAge: 300000 }
  );
}

function setSortMode(mode) {
  if (sortMode === mode) {
    sortOrder = sortOrder === 'asc' ? 'desc' : 'asc';
  } else {
    sortMode = mode;
    sortOrder = 'asc';
  }
  renderResults();
}

function setDisplayMode(mode) {
  displayMode = mode;
  document.getElementById('unit-pence')?.classList.toggle('active', mode === 'pence');
  document.getElementById('unit-tank')?.classList.toggle('active', mode === 'tank');
  renderResults();
}

function setRadius(val) {
  val = Math.min(100, Math.max(1, parseFloat(val) || 15));
  document.getElementById('radius').value = val;
  document.getElementById('radius-slider').value = val;
  document.getElementById('radius-val').textContent = val + ' km';
  document.querySelectorAll('.preset-btn').forEach(b => {
    b.classList.toggle('active', parseFloat(b.dataset.r) === val);
  });
  updateDrawerSummary();
  if (priceData && myLat && myLon) runSearch();
}

document.getElementById('file-input').addEventListener('change', (e) => loadFile(e.target.files[0]));
document.getElementById('btn-locate').addEventListener('click', locateMe);
document.getElementById('btn-search').addEventListener('click', runSearch);

// Drag-and-drop onto the data-status badge
const dataStatus = document.getElementById('data-status');
dataStatus.addEventListener('dragover', (e) => { e.preventDefault(); dataStatus.style.borderColor = 'var(--accent)'; });
dataStatus.addEventListener('dragleave', () => { dataStatus.style.borderColor = ''; });
dataStatus.addEventListener('drop', (e) => { e.preventDefault(); dataStatus.style.borderColor = ''; loadFile(e.dataTransfer.files[0]); });

['mpg', 'tank'].forEach(id => {
  document.getElementById(id)?.addEventListener('keydown', (e) => { if (e.key === 'Enter' && priceData) runSearch(); });
});

['mpg', 'tank'].forEach(id => {
  const el = document.getElementById(id);
  el?.addEventListener('input', updateDrawerSummary);
  el?.addEventListener('change', () => {
    updateDrawerSummary();
    if (priceData && myLat && myLon) runSearch();
  });
});

document.getElementById('fuel-type')?.addEventListener('change', () => {
  updateDrawerSummary();
  if (priceData && myLat && myLon) runSearch();
});

document.getElementById('radius-slider').addEventListener('input', (e) => setRadius(e.target.value));
document.getElementById('radius').addEventListener('input', (e) => setRadius(e.target.value));
document.querySelectorAll('.preset-btn').forEach(b => {
  b.addEventListener('click', () => setRadius(b.dataset.r));
});

document.getElementById('exclude-costco').addEventListener('change', () => {
  updateDrawerSummary();
  if (priceData && myLat && myLon) runSearch();
});
document.getElementById('exclude-motorway').addEventListener('change', () => {
  updateDrawerSummary();
  if (priceData && myLat && myLon) runSearch();
});

document.getElementById('unit-pence')?.addEventListener('click', () => setDisplayMode('pence'));
document.getElementById('unit-tank')?.addEventListener('click', () => setDisplayMode('tank'));
document.getElementById('mobile-sidebar-toggle').addEventListener('click', toggleMobileSidebar);
document.getElementById('btn-minimize-panel')?.addEventListener('click', toggleMobileSidebar);
document.getElementById('sidebar-drag-handle')?.addEventListener('click', toggleMobileSidebar);
mobileSidebarQuery.addEventListener('change', syncMobileSidebarState);

// Attempt to auto-fetch prices_latest.json on load for seamless experience
const tryFetchJson = (url) => fetch(url).then(res => res.ok ? res.json() : null);
const todayStr = new Date().toISOString().split('T')[0];

tryFetchJson('prices_latest.json')
  .then(data => data || tryFetchJson(`prices_${todayStr}.json`))
  .then(data => {
    if (data && data.stations && Array.isArray(data.stations)) {
      priceData = data;
      setDataStatus('prices_latest.json', data.stations.length);
      document.getElementById('btn-search').disabled = false;
      if (myLat && myLon) {
        runSearch();
      }
    } else {
      const el = document.getElementById('data-status');
      const text = document.getElementById('data-status-text');
      if (el) { el.style.display = 'inline-flex'; text.textContent = '📂 Load JSON'; }
    }
  })
  .catch(() => {
    const el = document.getElementById('data-status');
    const text = document.getElementById('data-status-text');
    if (el) { el.style.display = 'inline-flex'; text.textContent = '📂 Load JSON'; }
  });

initMap();
updateLocationDisplay(myLat, myLon);
locateMe(true);
syncMobileSidebarState();
updateDrawerSummary();
</script>
</body>
</html>
